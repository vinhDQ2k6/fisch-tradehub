spring.application.name=tradehub_core
# MySQL Connection
spring.datasource.url=jdbc:mysql://localhost:3306/ftradehub?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate/JPA Configuration (Optional but common)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Session Cookie Configuration (Fix for Localhost Login)
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true

# OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=98065421628-qbgs8h6h8eak6k66bftmkaebfb36jm43.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=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
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
# PayOS Configuration
payos.client-id=${PAYOS_CLIENT_ID:dummy-client-id}
payos.api-key=${PAYOS_API_KEY:dummy-api-key}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:dummy-checksum-key}
